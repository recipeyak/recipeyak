[package]
name = "recipeyak"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = [".", "cornucopia"]

[dependencies]
axum = "0.8"
axum-extra = { version = "0.12.6", features = ["cookie"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
cornucopia = { path = "cornucopia", default-features = false, features = ["deadpool"] }
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "preserve_order"] }
utoipa-axum = "0.3.0"
tower-http = { version = "0.7.1", features = ["timeout", "trace"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
deadpool-postgres = "0.14.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rand = "0.10"
sentry = { version = "0.49.3", default-features = false, features = ["backtrace", "contexts", "panic", "release-health", "reqwest", "rustls", "tower-axum-matched-path", "tracing"] }

[dev-dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
