[package]
name = "recipeyak"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = [".", "crates/django-session"]
default-members = [".", "crates/django-session"]

[dependencies]
axum = "0.8"
axum-extra = { version = "0.12.6", features = ["cookie"] }
chrono = { version = "0.4", features = ["serde"] }
django-session = { path = "crates/django-session" }
clap = { version = "4.6.7", features = ["derive"] }
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "preserve_order"] }
utoipa-axum = "0.3.0"
tower-http = { version = "0.7.1", features = ["trace"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
