[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    { name="Steve Dignam", email="steve@dignam.xyz" },
    { name="Christopher Dignam", email="chris@dignam.xyz" },
]

requires-python = ">=3.14"
dependencies = [
    "django~=5.2.11",
    "dj-database-url==3.1.2",
    "gunicorn==26.1.0",
    "django-user-sessions~=2.0",
    # django-user-sessions imports pkg_resources, which python no longer
    # bundles and setuptools dropped in 81
    "setuptools<81",
    "python-dotenv==1.2.3",
    "djangorestframework-types~=0.9.0",
    "orjson==3.12.0",
    "psycopg2-binary~=2.9.12",
    "boto3~=1.43.78",
    "yarl~=1.24.5",
    "advocate~=1.0.0",
    "pillow~=12.3.0",
    "httpx~=0.28.1",
    "asyncpg~=0.31.0",
    "asyncpg-stubs~=0.31.3",
    "typer~=0.27.1",
    "structlog~=26.1.0",
    "pillow-heif~=1.5.0",
    "tldextract~=5.3.2",
    "sentry-sdk~=2.68.0",
    "ably~=3.1.2",
    "recipe-scrapers~=15.12.0",
    "algoliasearch~=3.0.0",
    "async-timeout~=5.0.1",
    "aiohttp~=3.14.3",
    "ruamel-yaml~=0.19.1",
    "pydantic-settings~=2.15.0",
    "jsonref~=1.1.0",
    "pywatchman~=4.0.0",
    "pydantic[email]~=2.13.4",
    "markdownify>=0.13.1",
]

[tool.uv]
dev-dependencies = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ipdb~=0.13.13",
    "django-types~=0.24.0",
    "types-pyyaml~=6.0.0",
    # advocate pins urllib3<2, so the newer stubs, which require urllib3>=2, conflict
    "types-requests~=2.25.11",
    "types-urllib3~=1.26.23",
    "syrupy~=6.0.0",
    "types-dj-database-url~=1.3.0",
    "mypy~=2.3.1",
    "bpython~=0.26",
    "ruff~=0.16.4",
    "pytest-xdist~=3.8.0",
    "boto3-stubs[s3]~=1.43.78",
]
package = false

[tool.ruff]
src = ["recipeyak"]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "TID252",
    "I001",
    "T20",
    "C4",
    "UP",
    "N",
    "BLE",
    "B",
    "RET",
    "SIM",
    "ARG",
    "DTZ",
    "ERA",
    "PTH",
    "TC",
    "PYI",
    "PT",
    "INP001",
    "T100",
    "PGH003",
    "RUF",
]
ignore = [
    "E501", # line length is handled by black
    "ARG001", # pytest fixtures mess with this
    "ARG002", # sometimes parent classes require params
    "N806", # django migrations violate this a lot
    "B008", # type.Argument violates this
    "N815", # we mix and match casing in serializers
    "ARG005", # monkey patching false positive with *args, and **kwargs
    "N805", # false positive with pydantic
    "N802", # DRF serializers mess with this
    "RET505", # if, elif, else are fine with returns
    "RET507", # if, elif, else with continue is also fine
    "RET508", # if, elif, else with break is also fine
    "TC003", # not until autofixable
    "TC002", # not until autofixable
    "TC001", # not until autofixable
    # these all want codebase wide rewrites that are worth doing on their own:
    "UP040", # TypeAlias -> the `type` keyword
    "UP042", # str + Enum -> StrEnum, which changes how members stringify
    "UP046", # Generic[T] -> PEP 695 type parameters
    "UP047", # generic functions -> PEP 695 type parameters
    # Decimal(4.92892) and Decimal("4.92892") are not the same number, so
    # this one needs a careful look at each call site
    "RUF032",
]
unfixable = ["ERA001"] # we want to check ourselves before we delete commented out code. Also this doesn't cleanup all of it.

[tool.ruff.lint.per-file-ignores]
"recipeyak/migrations/*" = [
    # it's very common to use class vars in Django migrations.
    "RUF012",
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.isort]
known-third-party = ["django"]
known-first-party = ["recipeyak"]

[tool.ruff.lint.flake8-tidy-imports]
# Disallow all relative imports.
ban-relative-imports = "all"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "recipeyak.django.settings"
python_files = "*_test.py *_tests.py"
addopts = "-s --pdbcls IPython.terminal.debugger:TerminalPdb --reuse-db -p no:warnings -p no:pastebin -p no:nose -p no:doctest -p no:freeze_support -p no:stepwise -p no:python_path -p no:setuponly -p no:setupplan -p no:legacypath-tmpdir -p no:unittest"
testpaths = "recipeyak"


[tool.mypy]
mypy_path = "./typings"
files = ["**/*.py"]

show_column_numbers = true
show_error_codes = true

disallow_any_unimported=false
disallow_any_expr=false
disallow_any_decorated=false
disallow_any_explicit=false
disallow_any_generics=true
disallow_subclassing_any=false

disallow_untyped_calls=false
disallow_untyped_defs=true
disallow_incomplete_defs=true
check_untyped_defs=true
disallow_untyped_decorators=true

no_implicit_optional=true
strict_optional=true

warn_redundant_casts=true
warn_unused_ignores=true
warn_no_return=true
warn_return_any=true
# doesn't consider how methods can change the value of properties
warn_unreachable=false

strict_equality=true

ignore_missing_imports=false

plugins = [
  "pydantic.mypy"
]

[[tool.mypy.overrides]]
module = [
    'icalendar.*',
    'advocate.*',
    'user_sessions.*',
    'ably.*',
    'ruamel.*'
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true
