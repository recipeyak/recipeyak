name: Infrastructure

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "SHA to deploy"
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: false

# TODO: Skip if no changes in directory
jobs:
  lint_docker:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v3
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      - name: Run linter
        uses: jbergstroem/hadolint-gh-action@c2775062958a44c8ab94c1b25cb0cf1ced7af4e8
        with:
          dockerfile: "**/*.Dockerfile"

  lint_shell:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v3
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      - name: Install dependencies
        run: |
          sudo apt install shellcheck
      - name: Run shellcheck
        run: ./s/shellcheck

  build_api_container:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' }}
    env:
      # Dependabot and fork PRs don't get secrets, so build without pushing.
      PUSH: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v3
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        if: ${{ env.PUSH == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: "{{defaultContext}}:backend"
          push: ${{ env.PUSH == 'true' }}
          file: "django.Dockerfile"
          tags: recipeyak/django:${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=django
          cache-to: type=gha,scope=django,mode=max
          build-args: |
            GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}

  build_ui_container:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' }}
    env:
      # Dependabot and fork PRs don't get secrets, so build without pushing.
      PUSH: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v3
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        if: ${{ env.PUSH == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "frontend/package.json"
          cache-dependency-path: "frontend/package-lock.json"
          cache: "npm"
      - name: Install dependencies
        working-directory: "frontend"
        run: npm ci
      - name: Build
        env:
          FRONTEND_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        working-directory: "frontend"
        run: |
          # TODO: could get fancier and determine if there have been any backwards incompatible changes
          export FRONTEND_API_GIT_TREE_SHA=$(shasum --algorithm 256 ../backend/api-schema.json)
          s/build
      - name: Build and push
        working-directory: "./frontend"
        env:
          GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$PUSH" = "true" ]; then
            docker buildx build --push -f react.Dockerfile --tag "recipeyak/react:$GIT_SHA" .
            echo "Pushed \`recipeyak/react:$GIT_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          else
            docker buildx build -f react.Dockerfile --tag "recipeyak/react:$GIT_SHA" .
          fi

  deploy:
    needs: [build_api_container, build_ui_container]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_AUTH_SOCK: /tmp/ssh_agent.sock

      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v3
        with:
          persist-credentials: false
      - name: "SSH to server and deploy"
        run: ./infra/ssh-to-server

  deploy_workflow_dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_AUTH_SOCK: /tmp/ssh_agent.sock

      GIT_SHA: ${{ github.event.inputs.commit_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v3
        with:
          persist-credentials: false
      - name: "SSH to server and deploy"
        run: ./infra/ssh-to-server
