# Django stays as the backup for backend-rs so its endpoints keep working if the
# Rust server is down or not yet deployed.
upstream recipeyak_rs {
    server 127.0.0.1:8001;
    server 127.0.0.1:8000 backup;
}

upstream recipeyak_django {
    server 127.0.0.1:8000;
}

# Endpoints served by backend-rs. Everything else goes to Django.
# Keep in sync with backendRsRoutes in frontend/vite.config.ts.
map "$request_method $uri" $api_upstream {
    "GET /api/v1/calendar/"                   recipeyak_rs;
    "POST /api/v1/calendar/"                  recipeyak_rs;
    "GET /api/v1/calendar/settings/"          recipeyak_rs;
    "PATCH /api/v1/calendar/settings/"        recipeyak_rs;
    "POST /api/v1/calendar/generate_link/"    recipeyak_rs;
    "~^(PATCH|DELETE) /api/v1/calendar/\d+/$" recipeyak_rs;
    "GET /api/v1/calendars/"                  recipeyak_rs;
    "POST /api/v1/calendars/"                 recipeyak_rs;
    "~^DELETE /api/v1/calendars/\d+/$"        recipeyak_rs;
    "~^POST /api/v1/calendars/\d+/pin/$"      recipeyak_rs;
    default                                   recipeyak_django;
}

# kill all requests for unknown hostnames or IP addresses.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name "";
    return 444;
    # skipping logging
}

# redirect to HTTPS and recipeyak.com
server {
    listen 80;
    listen [::]:80;
    server_name recipeyak.com www.recipeyak.com;
    return 301 https://recipeyak.com$request_uri;
    # skipping logging
}

server {
    root /var/www/html;

    index index.html index.htm index.nginx-debian.html;

    server_name recipeyak.com www.recipeyak.com;

    include snippets/recipeyak_headers.conf;

    if ($http_host = www.recipeyak.com){
        return  301 https://recipeyak.com$request_uri;
    }

    if ($http_host != recipeyak.com) {
        return 444;
    }

    if ($http_user_agent ~* ".*(facebookexternalhit|twitter|whatsapp|snap url preview service).*") {
        rewrite ^(/recipes/)(\d+) /api/v1/bot-recipes/$2 break;
    }

    location / {
        include snippets/recipeyak_headers.conf;

        # Ensure the browser doesn't cache the index.html.
        # Without cache-control headers, browsers use
        # heuristic caching.
        add_header Cache-Control "no-store";
          root /var/app/dist;
        # First attempt to serve request as file, then
        # as directory, then fall back to displaying a 404.
        try_files $uri /index.html ;
    }
    # UI pages land here via try_files above. backend-rs adds the first page's
    # data to the file, falling back to the plain file when it's down.
    location = /index.html {
        include snippets/recipeyak_headers.conf;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Request-Start "t=${msec}";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @static_index;
    }
    location @static_index {
        include snippets/recipeyak_headers.conf;
        add_header Cache-Control "no-store";
        root /var/app/dist;
        try_files /index.html =404;
    }
        location /avatar {
        # Reduce the information we send about users
        proxy_pass_request_headers off;
        proxy_pass https://www.gravatar.com;
        proxy_hide_header Cache-Control;
        # max age 5 minutes (gravatar's set value), allow stale for up to 7 days
        add_header Cache-Control 'max-age=600, stale-while-revalidate=604800';
    }

    location ~* ^/(api|rest-auth|admin|api-auth|.+\.(json|yaml|yml|ics)) {
        include snippets/recipeyak_headers.conf;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        # lets Django measure how long the request waited for a gunicorn worker
        proxy_set_header X-Request-Start "t=${msec}";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Upstream-Response-Time $upstream_header_time;
    }


    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/recipeyak.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/recipeyak.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
