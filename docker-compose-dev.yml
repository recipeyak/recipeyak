version: "3"
services:
  db:
    image: postgres:18.4
    command:
      [
        "-c",
        'shared_preload_libraries="pg_stat_statements"',
        "-c",
        "pg_stat_statements.max=10000",
        "-c",
        "pg_stat_statements.track=all",
      ]
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data/
volumes:
  pgdata:
    driver: local
